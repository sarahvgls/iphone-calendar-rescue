[project]
name = "iphone-calendar-rescue"
version = "1.0.0"
description = "Turn an iPhone backup into .ics calendar files you can import anywhere."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sarah Vogels" }]
keywords = ["iphone", "ios", "backup", "calendar", "ics", "icalendar", "sqlitedb"]

# No dependencies on purpose: the tool runs on a plain Python install.
dependencies = []

[project.urls]
Homepage = "https://github.com/sarahvgls/iphone-calendar-rescue"
Issues = "https://github.com/sarahvgls/iphone-calendar-rescue/issues"

[project.scripts]
calendar-rescue = "calendar_rescue:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["calendar_rescue"]
